name: Repackage Dify Plugin

on:
  workflow_dispatch:
    inputs:
      plugin_author:
        description: "plugin author"
        required: true
        type: string
      plugin_name:
        description: "plugin name"
        required: true
        type: string
      plugin_version:
        description: "plugin version"
        required: true
        type: string
      platform_arm:
        description: "Use ARM platform (true = manylinux_2_17_aarch64, false = manylinux_2_17_x86_64)"
        required: true
        default: "false"

jobs:
  repackage:
    runs-on: ubuntu-latest
    steps:
      - name: Print workflow inputs
        run: |
          echo "plugin_author  = ${{ inputs.plugin_author }}"
          echo "plugin_name    = ${{ inputs.plugin_name }}"
          echo "plugin_version = ${{ inputs.plugin_version }}"
          echo "platform_arm   = ${{ inputs.platform_arm }}"

      - name: Resolve platform
        run: |
          if [ "${{ inputs.platform_arm }}" = "true" ]; then
            echo "PIP_PLATFORM=manylinux_2_17_aarch64" >> "$GITHUB_ENV"
            echo "PACKAGE_SUFFIX=offline-arm" >> "$GITHUB_ENV"
          else
            echo "PIP_PLATFORM=manylinux_2_17_x86_64" >> "$GITHUB_ENV"
            echo "PACKAGE_SUFFIX=offline" >> "$GITHUB_ENV"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make plugin_repackaging.sh executable
        run: chmod +x ./plugin_repackaging.sh

            # ✅ 终极调试：通过 PyPI API 验证 gevent 26.5.0 wheel
      - name: Debug - Check gevent 26.5.0 wheel via PyPI API
        run: |
          echo "=========================================="
          echo "Checking gevent 26.5.0 for: ${{ env.PIP_PLATFORM }} / cp312"
          echo "=========================================="
          
          # 使用 PyPI JSON API 获取 26.5.0 的所有文件列表
          RESPONSE=$(curl -sL https://pypi.org/pypi/gevent/26.5.0/json)
          
          # 检查是否存在 manylinux x86_64 + cp312 的 wheel
          MATCH=$(echo "$RESPONSE" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          files = data.get('urls', [])
          target_platform = '${{ env.PIP_PLATFORM }}'
          found = []
          for f in files:
              fn = f.get('filename', '')
              # 匹配 cp312 + manylinux x86_64 的 wheel
              if 'cp312' in fn and 'manylinux' in fn and 'x86_64' in fn and fn.endswith('.whl'):
                  found.append(fn)
          if found:
              print('WHEELS_FOUND')
              for w in found:
                  print(f'  - {w}')
          else:
              print('NO_WHEEL')
              print('All available files for 26.5.0:')
              for f in files:
                  print(f'  - {f[\"filename\"]}')
          ")
          
          echo "$MATCH"
          
          if echo "$MATCH" | grep -q "WHEELS_FOUND"; then
            echo ""
            echo "✅ gevent 26.5.0 HAS compatible wheels"
          else
            echo ""
            echo "❌ gevent 26.5.0 has NO compatible wheel for cp312 + manylinux x86_64"
          fi

     

      - name: Run plugin repackaging script
        run: |
          PIP_MIRROR_URL=https://pypi.org/simple \
          ./plugin_repackaging.sh \
          -p ${{ env.PIP_PLATFORM }} \
          -s ${{ env.PACKAGE_SUFFIX }} \
          market \
          "${{ github.event.inputs.plugin_author }}" \
          "${{ github.event.inputs.plugin_name }}" \
          "${{ github.event.inputs.plugin_version }}"

      - name: Find repackaged artifact
        run: |
          ARTIFACT_PATH=$(find . -type f -name "*-${PACKAGE_SUFFIX}.difypkg" | head -n 1)
          if [ -z "$ARTIFACT_PATH" ]; then
            echo "No *-${PACKAGE_SUFFIX}.difypkg artifact found!"
            exit 1
          fi
      
          echo "ARTIFACT_PATH=$ARTIFACT_PATH" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=$(basename "$ARTIFACT_PATH")" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}
